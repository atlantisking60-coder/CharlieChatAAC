<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Charlie Chat AAC - Communication app for all devices">
  
  <!-- Theme color for mobile browsers -->
  <meta name="theme-color" content="#008080">
  <meta name="msapplication-TileColor" content="#008080">

  <!-- iOS web app configuration -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Charlie Chat">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon and icons -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <!-- Progressive Web App support -->
  <link rel="shortcut icon" href="favicon.png">

  <!-- OCR Engine for Web (Tesseract.js) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <title>Charlie Chat</title>
  
  <!-- Browser compatibility polyfills -->
  <script>
    // Polyfill for older browsers
    if (!window.requestAnimationFrame) {
      window.requestAnimationFrame = function(callback) {
        return setTimeout(callback, 1000 / 60);
      };
    }
  </script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #flutter-loading {
      text-align: center;
      font-size: 16px;
      color: #666;
    }
    /* Disable text selection and drag */
    * {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    /* Re-enable selection inside input fields */
    input, textarea, [contenteditable="true"] {
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
    }
  </style>

  <!-- Right-click & dev-tools protection -->
  <script>
    // Disable right-click context menu
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      return false;
    }, false);

    // Disable drag
    document.addEventListener('dragstart', function(e) {
      e.preventDefault();
    }, false);

    // Block common dev-tools keyboard shortcuts
    document.addEventListener('keydown', function(e) {
      // F12
      if (e.key === 'F12') {
        e.preventDefault();
        return false;
      }
      // Ctrl+Shift+I (DevTools)
      if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i')) {
        e.preventDefault();
        return false;
      }
      // Ctrl+Shift+J (Console)
      if (e.ctrlKey && e.shiftKey && (e.key === 'J' || e.key === 'j')) {
        e.preventDefault();
        return false;
      }
      // Ctrl+Shift+C (Inspect element)
      if (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c')) {
        e.preventDefault();
        return false;
      }
      // Ctrl+U (View source)
      if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) {
        e.preventDefault();
        return false;
      }
      // Ctrl+S (Save page)
      if (e.ctrlKey && (e.key === 'S' || e.key === 's')) {
        e.preventDefault();
        return false;
      }
      // Ctrl+A (Select all - block outside inputs)
      if (e.ctrlKey && (e.key === 'A' || e.key === 'a') && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
        e.preventDefault();
        return false;
      }
      // Ctrl+P (Print)
      if (e.ctrlKey && (e.key === 'P' || e.key === 'p')) {
        e.preventDefault();
        return false;
      }
    }, false);

    // Disable browser developer tools via debugger statement (works in some browsers)
    (function() {
      var devtoolsOpen = false;
      var threshold = 160;
      setInterval(function() {
        var widthThreshold = window.outerWidth - window.innerWidth > threshold;
        var heightThreshold = window.outerHeight - window.innerHeight > threshold;
        if (widthThreshold || heightThreshold) {
          if (!devtoolsOpen) {
            devtoolsOpen = true;
            document.body.innerHTML = '';
            document.body.style.display = 'none';
          }
        } else {
          devtoolsOpen = false;
        }
      }, 1000);
    })();
  </script>

</head>
<body>
  <div id="flutter-loading">Loading...</div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
